name: Deploy

# Triggers:
#   - PRs to staging or main: run tests only (no deploy)
#   - Push to staging: test → deploy-staging (auto, no gate)
#   - Push to main: test → deploy-prod (requires manual approval in GitHub Environments)

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  # Runs on every PR and every push to staging/main.
  # Uses a fully local Supabase Docker stack — no cloud credentials needed here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        run: |
          SUPABASE_URL=$(supabase status --output env | grep 'API_URL' | cut -d= -f2 | tr -d '"\r')
          SUPABASE_ANON_KEY=$(supabase status --output env | grep 'ANON_KEY' | cut -d= -f2 | tr -d '"\r')
          echo "VITE_SUPABASE_URL=${SUPABASE_URL}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> "$GITHUB_ENV"

      - name: Validate Supabase env vars
        run: |
          [[ "$VITE_SUPABASE_URL" == http* ]] || { echo "VITE_SUPABASE_URL is malformed: [$VITE_SUPABASE_URL]"; exit 1; }
          [[ "$VITE_SUPABASE_URL" != *'"'* ]] || { echo "VITE_SUPABASE_URL contains quotes"; exit 1; }
          [[ -n "$VITE_SUPABASE_ANON_KEY" ]] || { echo "VITE_SUPABASE_ANON_KEY is empty"; exit 1; }
          echo "Env vars OK — URL=${VITE_SUPABASE_URL}"

      - name: Apply migrations and seed
        run: supabase db reset --local

      - name: Wait for Supabase auth to be ready
        run: |
          for i in $(seq 1 45); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:54321/auth/v1/health)
            if [ "$STATUS" = "200" ]; then echo "Auth ready after $i attempts"; exit 0; fi
            echo "Waiting for auth... ($i/45)"
            sleep 3
          done
          echo "Auth never became ready after 135s" && exit 1

      - name: Run unit tests
        run: npm test -- --run

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── 2. Deploy to staging ─────────────────────────────────────────────────────
  # Runs automatically after tests pass on a push to staging.
  # Applies migrations, reseeds staging DB, then deploys frontend via Vercel CLI.
  # Secrets are scoped to the staging GitHub Environment — prod secrets are not
  # readable from this job.
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Apply migrations to staging
        run: |
          supabase link --project-ref ${{ secrets.STAGING_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Seed staging database
        # Uses the Supabase CLI Management API — no direct DB connection needed.
        # Staging is reset to a known state on every merge (intentionally ephemeral).
        run: supabase db query --linked --file supabase/seed.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Verify migration list
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Deploy frontend to Vercel (staging)
        run: npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 3. Deploy to production ───────────────────────────────────────────────────
  # Runs after tests pass on a push to main.
  # Pauses for manual approval via the production GitHub Environment before running.
  # Applies migrations first, then deploys frontend — both happen atomically in one
  # gated job so the DB and frontend are always in sync.
  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Apply migrations to production
        run: |
          supabase link --project-ref ${{ secrets.PROD_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

      - name: Verify migration list
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

      - name: Deploy frontend to Vercel (production)
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
