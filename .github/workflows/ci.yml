name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        run: |
          SUPABASE_URL=$(supabase status --output env | grep 'API_URL' | cut -d= -f2)
          SUPABASE_ANON_KEY=$(supabase status --output env | grep 'ANON_KEY' | cut -d= -f2)
          echo "VITE_SUPABASE_URL=${SUPABASE_URL}" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env.test

      - name: Apply migrations and seed
        run: supabase db reset --local

      - name: Run unit tests
        run: npm test -- --run

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
